[package]
name = "welth-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = {
    version = "0.9",
    features = [
        "runtime-tokio",
        "postgres",
        "uuid",
        "chrono",
        "rust_decimal",
        "macros",
        "migrate"
    ]
}
uuid = {
    version = "1",
    features = ["v4", "serde"]
}

chrono = {
    version = "0.4",
    features = ["serde"]
}

rust_decimal = {
    version = "1",
    features = ["serde"]
}

dotenvy = "0.15"

jsonwebtoken = "9"

argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

tower-http = {
    version = "0.6",
    features = ["cors"]
}

thiserror = "2"

tracing = "0.1"
tracing-subscriber = {
    version = "0.3",
    features = ["env-filter"]
}